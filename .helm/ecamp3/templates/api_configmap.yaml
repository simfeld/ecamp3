apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.name" . }}-configmap
  labels:
    {{- include "api.selectorLabels" . | nindent 4 }}
    {{- include "app.commonLabels" . | nindent 4 }}
data:
  # Also trusts the api's own internal cluster-DNS Service name (e.g. ecamp3-simfeld-api) --
  # not reachable from outside the cluster, so this doesn't weaken the check for real traffic --
  # needed so in-cluster callers like the Keycloak SPI (which reaches the api via that internal
  # name, not the public domain) don't get rejected by Symfony's trusted_hosts check.
  ADDITIONAL_TRUSTED_HOSTS: {{ printf "%s|%s" .Values.domain (include "api.name" .) | quote }}
  {{- if and (.Values.api.authenticationTokenTtl) (ne (.Values.api.authenticationTokenTtl | toString) "<no value>") }}
  AUTHENTICATION_TOKEN_TTL: {{ .Values.api.authenticationTokenTtl | quote }}
  {{- end }}
  COOKIE_PREFIX: {{ include "api.cookiePrefix" . | quote }}
  APP_ENV: {{ .Values.api.appEnv | quote }}
  APP_DEBUG: {{ .Values.api.appDebug | quote }}
  {{- if .Values.api.dataMigrationsDir }}
  DATA_MIGRATIONS_DIR: {{ .Values.api.dataMigrationsDir | quote }}
  {{- end }}
  CORS_ALLOW_ORIGIN: {{ include "frontend.url" . | quote }}
  TRUSTED_PROXIES: "{{ join "," .Values.api.trustedProxies }}"
  {{- if .Values.api.sentryDsn }}
  SENTRY_API_DSN: {{ .Values.api.sentryDsn | quote }}
  SENTRY_ENVIRONMENT: {{ .Values.domain | quote }}
  {{- else }}
  SENTRY_API_DSN: {{ "" | quote }}
  {{- end }}
  FRONTEND_BASE_URL: {{ include "frontend.url" . | quote }}
  HITOBITO_PBSMIDATA_API_BASE_URL: {{ .Values.api.hitobito.pbsmidataApiBaseUrl | quote }}
  HITOBITO_API_OAUTH_SCOPES: {{ .Values.api.hitobito.oauthScopes | quote }}
  CADDY_GLOBAL_OPTIONS: {{ .Values.api.caddyGlobalOptions | quote }}
  API_CACHE_ENABLED: {{ .Values.apiCache.enabled | quote }}
  {{- if .Values.apiCache.enabled }}
  VARNISH_API_URL: {{  printf "%s:%d" (include "apiCache.name" .) (.Values.apiCache.service.ports.purge | int)  | quote }}
  {{- else }}
  VARNISH_API_URL: {{ "" | quote }}
  {{- end}}
  {{- if .Values.api.num_threads }}
  NUM_THREADS: {{ .Values.api.num_threads | quote }}
  {{- end }}
  {{- if .Values.keycloak.enabled }}
  # Overrides api/.env's docker-compose-only defaults (host "keycloak"), which don't resolve
  # in-cluster -- the Operator names the Service "<keycloak-cr-name>-service" (see
  # keycloak_httproute.yaml), not "keycloak".
  KEYCLOAK_INTERNAL_BASE_URL: {{ printf "http://%s-service:8080%s" (include "keycloak.name" .) .Values.keycloak.subpath | quote }}
  KEYCLOAK_EXTERNAL_BASE_URL: {{ printf "https://%s%s" .Values.domain .Values.keycloak.subpath | quote }}
  KEYCLOAK_REALM: "ecamp"
  KEYCLOAK_AUDIENCE: "ecamp-api"
  {{- end }}
