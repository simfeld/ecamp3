{{- if and .Values.keycloak.enabled .Values.gateway.enabled -}}
# Unlike api_httproute.yaml, this does NOT strip the path prefix: Keycloak is configured
# (via spec.hostname.hostname in keycloak.yaml) to know it's served under
# {{ .Values.keycloak.subpath }} itself, matching the local dev-compose Traefik setup
# (dev-setup/traefik/dynamic.yml's `web-keycloak` router, which also doesn't strip
# `/keycloak` -- unlike `/mock-auth`, which does, since that upstream isn't
# relative-path-aware). Stripping here would break every URL Keycloak itself generates.
#
# NOTE: `backendRefs.name` assumes the Operator names its auto-created Service
# `<Keycloak-CR-name>-service` -- verify this against the actually-installed Operator
# version (`kubectl get svc` after the Keycloak CR reconciles) before relying on it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "keycloak.name" . }}
  labels:
    {{- include "keycloak.selectorLabels" . | nindent 4 }}
    {{- include "app.commonLabels" . | nindent 4 }}
  annotations:
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: api-gateway
  hostnames:
    - {{ .Values.domain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.keycloak.subpath }}
      backendRefs:
        - name: {{ include "keycloak.name" . }}-service
          port: 8080
{{- end -}}
