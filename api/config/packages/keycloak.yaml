parameters:
    # Local-dev-only proof of concept, see App\Security\OAuth\KeycloakBearerAuthenticator.
    app.keycloak.jwks_uri: '%env(KEYCLOAK_INTERNAL_BASE_URL)%/realms/%env(KEYCLOAK_REALM)%/protocol/openid-connect/certs'
    app.keycloak.issuer: '%env(KEYCLOAK_EXTERNAL_BASE_URL)%/realms/%env(KEYCLOAK_REALM)%'
    app.keycloak.audience: '%env(KEYCLOAK_AUDIENCE)%'
    # Shared secret the ecamp-user-storage SPI sends as X-Internal-Auth when calling
    # /internal/user-lookup (see App\Controller\InternalUserLookupController).
    app.keycloak.spi_lookup_secret: '%env(KEYCLOAK_SPI_LOOKUP_SECRET)%'
