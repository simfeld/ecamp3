services:
  frontend:
    image: node:24.21.0
    container_name: 'ecamp3-frontend'
    ports:
      - '9229:9229' # jest debug
    stdin_open: true
    tty: true
    user: ${USER_ID:-1000}
    volumes:
      - ./.prettierrc:/.prettierrc:delegated
      - ./frontend:/app:delegated
      - ./common:/common:delegated
      - ./.cache/npm:/home/node/.npm/_cacache:delegated
      - ./.cache/npm/sentry-cli:/home/node/.npm/sentry-cli:delegated
    environment:
      - NODE_ENV=development
      - NPM_CONFIG_UPDATE_NOTIFIER=false
      - NPM_CONFIG_CACHE=/home/node/.npm
      - CI=${CI:-}
    working_dir: /app
    command: ./docker-setup.sh
    stop_signal: SIGKILL

  frontend-old:
    image: node:24.21.0
    container_name: 'ecamp3-frontend-old'
    stdin_open: true
    tty: true
    user: ${USER_ID:-1000}
    volumes:
      - ./.prettierrc:/.prettierrc:delegated
      - ./frontend-old:/app:delegated
      - ./common:/common:delegated
      #- ./pdf:/pdf:delegated
      - ./.cache/npm:/home/node/.npm/_cacache:delegated
      - ./.cache/npm/sentry-cli:/home/node/.npm/sentry-cli:delegated
    environment:
      - NODE_ENV=development
      - NPM_CONFIG_UPDATE_NOTIFIER=false
      - NPM_CONFIG_CACHE=/home/node/.npm
      - CI=${CI:-}
    working_dir: /app
    command: ./docker-setup.sh
    stop_signal: SIGKILL
    # The pdf module has been integrated back into the frontend, it's not built separately anymore
    #depends_on:
    #- pdf

  api:
    image: ${REGISTRY:-docker.io}/${REPO_OWNER:-ecamp}/ecamp3-api:${VERSION:-latest}
    build:
      context: ./api
      target: frankenphp_prod
    container_name: 'ecamp3-api'
    depends_on:
      - database
      - docker-host
      - mock-oauth2
    volumes:
      - ./api/config/jwt:/app/config/jwt:rw,delegated
    ports:
      - target: 2019
        published: 2019
        protocol: tcp
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      DATA_MIGRATIONS_DIR: ${DATA_MIGRATIONS_DIR:-dev-data}
      DATABASE_URL: "postgresql://ecamp3:ecamp3@database:5432/ecamp3dev?serverVersion\
        =15&charset=utf8"
      LOG_LEVEL: debug
      ADDITIONAL_TRUSTED_HOSTS: '.*'
      SERVER_NAME: ':3001'
    healthcheck:
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    restart: on-failure
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  http-cache:
    image: varnish:9.1.0
    container_name: 'ecamp3-http-cache'
    depends_on:
      api:
        condition: service_started
        restart: true
    volumes:
      - ./api/docker/varnish/vcl/:/etc/varnish/:ro
      - varnish_data:/var/lib/varnish
    command: -a :8081,HTTP -p http_max_hdr=96
    environment:
      - COOKIE_PREFIX=localhost_
      - SEND_XKEY_HEADERS_DOWNSTREAM=${SEND_XKEY_HEADERS_DOWNSTREAM:-true}
      - VARNISH_HTTP_PORT=8080

  http-cache-logs:
    image: varnish:9.1.0
    container_name: 'ecamp3-http-cache-logs'
    depends_on:
      - http-cache
    volumes:
      - varnish_data:/var/lib/varnish:ro
    command: varnishncsa

  print:
    image: node:24.21.0
    container_name: 'ecamp3-print'
    user: ${USER_ID:-1000}
    volumes:
      - ./.prettierrc:/.prettierrc
      - ./print:/app:delegated
      - ./common:/common:delegated
      - ./.cache/npm:/home/node/.npm/_cacache:delegated
      - ./.cache/npm/sentry-cli:/home/node/.npm/sentry-cli:delegated
    environment:
      - NUXT_HOST=0.0.0.0
      - NUXT_PORT=3003
      - NITRO_PORT=3003
      - NPM_CONFIG_UPDATE_NOTIFIER=false
      - NPM_CONFIG_CACHE=/home/node/.npm
      - CI=${CI:-}
    env_file:
      - ./print/print.env
    working_dir: /app
    command: ./docker-setup.sh
    stop_signal: SIGKILL

  database:
    image: postgres:18-alpine
    container_name: 'ecamp3-database'
    environment:
      - POSTGRES_DB=ecamp3dev
      - POSTGRES_PASSWORD=ecamp3
      - POSTGRES_USER=ecamp3
    volumes:
      - db-data-postgres:/var/lib/postgresql:rw
      - ./create-ecamp3-test-database.sh:/docker-entrypoint-initdb.d/create-ecamp3-test-database.sh
      # you may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./api/docker/db/data:/var/lib/postgresql/data:rw
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-128G}
          cpus: ${DB_CPU_LIMIT:-8}

  pg-admin:
    image: dpage/pgadmin4
    container_name: 'ecamp3-pg-admin'
    depends_on:
      - database
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@ecamp3.ch
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_ENABLE_SERVER_PASS_EXEC_CMD=True
    volumes:
      - ./pgadmin-servers.json:/pgadmin4/servers.json

  mail:
    image: maildev/maildev:3.0.0
    container_name: 'ecamp3-mail'
    environment:
      - MAILDEV_BASE_PATHNAME=/mail
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:1080/mail/api/healthz').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]

  docker-host:
    image: qoomon/docker-host
    container_name: 'ecamp3-docker-host-forwarder'
    cap_add: ['NET_ADMIN', 'NET_RAW']
    restart: on-failure

  browserless:
    image: ghcr.io/browserless/chromium:v2.38.2
    container_name: 'ecamp3-browserless'
    ports:
      - '3010:3000'
    environment:
      - TOKEN=1234
      - CONCURRENT=1
      - TIMEOUT=40000
      - QUEUED=10
      - ENABLE_DEBUGGER=false

  e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ['e2e']
    container_name: 'ecamp3-e2e'
    user: ${USER_ID:-1000}
    volumes:
      - ./.prettierrc:/.prettierrc
      - ./e2e:/e2e:delegated
    network_mode: host
    working_dir: /e2e

  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.5
    volumes:
      - ./dev-setup/mock-oauth/mock-oauth2-config.json:/app/config.json:ro
      - ./dev-setup/mock-oauth/mock-oauth2-login.html:/app/login.html:ro
    environment:
      JSON_CONFIG_PATH: /app/config.json
      SERVER_PORT: 8080

  # Local-dev-only proof of concept: a Keycloak instance issuing OAuth2 tokens for
  # third-party access to the eCamp API, kept fully separate from the eCamp login flow
  # above (password/Google/Hitobito), which keeps using Lexik JWT as before.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: 'ecamp3-keycloak'
    command: start-dev --import-realm
    volumes:
      - ./dev-setup/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - ./dev-setup/keycloak/themes/ecamp:/opt/keycloak/themes/ecamp:ro
      - ./dev-setup/keycloak/spi/ecamp-user-storage/target/ecamp-user-storage-spi.jar:/opt/keycloak/providers/ecamp-user-storage-spi.jar:ro
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_HOSTNAME: http://localhost:3000/keycloak
      KC_PROXY_HEADERS: xforwarded

  # Minimal static file server for the vanilla-JS third-party demo app (see
  # dev-setup/keycloak/demo-app/), so the Keycloak POC's authorization-code + PKCE flow
  # can be demonstrated by clicking through a real page instead of manual curl/URLs.
  keycloak-demo-app:
    image: nginx:1.31
    container_name: 'ecamp3-keycloak-demo-app'
    volumes:
      - ./dev-setup/keycloak/demo-app:/usr/share/nginx/html:ro

  reverse-proxy:
    image: traefik:v3.7.14
    container_name: 'ecamp3-reverse-proxy'
    volumes:
      - ./dev-setup/traefik/.:/etc/traefik/.:ro
    depends_on:
      - frontend
      - api
      - frontend-old
      - mock-oauth2
      - keycloak
      - keycloak-demo-app
      - http-cache
      - print
      - mail
      - pg-admin
    ports:
      - target: 3000
        published: 3000
        protocol: tcp
      - target: 3004
        published: 3004
        protocol: tcp
    stop_signal: SIGKILL

  translation:
    image: node:24.21.0
    profiles: ['translation']
    container_name: 'ecamp3-translation'
    volumes:
      - ./translation:/translation:delegated
      - ./common:/common:delegated
      - ./frontend:/frontend:delegated
      - ./print:/print:delegated
    working_dir: /translation
    command: tail -F anything

  prettier:
    image: node:24.21.0
    profiles: ['prettier']
    stdin_open: true
    tty: true
    user: ${USER_ID:-1000}
    volumes:
      - ./:/app:delegated
      - ./.cache/npm:/home/node/.npm
    working_dir: /app
    entrypoint: ./docker-setup.sh
    command: 'npm run lint'
    environment:
      - NPM_CONFIG_UPDATE_NOTIFIER=false
      - NPM_CONFIG_CACHE=/home/node/.npm
      - CI=${CI:-}

  # Local-dev-only proof of concept: builds the Keycloak User Storage SPI provider (see
  # dev-setup/keycloak/spi/ecamp-user-storage/) that validates eCamp password logins
  # live against eCamp's own API instead of storing a password hash in Keycloak. Never
  # started with the rest of the stack -- run explicitly with
  # `docker compose run --rm keycloak-spi-builder`.
  keycloak-spi-builder:
    image: maven:3.9-eclipse-temurin-21
    profiles: ['keycloak-spi-builder']
    container_name: 'ecamp3-keycloak-spi-builder'
    volumes:
      - ./dev-setup/keycloak/spi/ecamp-user-storage:/app
      - ./.cache/maven:/root/.m2
    working_dir: /app
    command: mvn --batch-mode package

volumes:
  db-data-postgres: null
  caddy_data:
  caddy_config:
  varnish_data:
